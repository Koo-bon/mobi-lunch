<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>★ 오늘 점심 뭐 먹지 ★ 운명의 돌림판</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    font-family: '궁서', '궁서체', GungSuh, AppleMyungjo, Batang, 바탕, serif;
    color: #220033;
    /* 촌스러운 사선 줄무늬 — 2000년대 홈페이지 배경 감성 */
    background:
      repeating-linear-gradient(45deg,
        #ffe600 0 28px, #ff00a8 28px 56px, #00e5ff 56px 84px, #7cff00 84px 112px);
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 10px 8px 40px; }

  /* ---------- 흐르는 글씨 ---------- */
  #ticker {
    width: 100%; max-width: 760px; overflow: hidden; white-space: nowrap;
    background: #000; color: #0f0; border: 4px ridge #c0c0c0;
    font-size: 15px; padding: 5px 0; letter-spacing: 1px;
  }
  #ticker span { display: inline-block; padding-left: 100%; animation: flow 14s linear infinite; }
  @keyframes flow { to { transform: translateX(-100%); } }

  /* ---------- 제목 ---------- */
  h1 {
    margin: 12px 0 2px; text-align: center; line-height: 1.25;
    font-size: clamp(30px, 8vw, 54px); font-weight: 700; letter-spacing: -1px;
    background: linear-gradient(90deg,#ff0000,#ff8a00,#ffee00,#00d437,#00b7ff,#8b00ff,#ff0000);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #000;
    filter: drop-shadow(3px 3px 0 #fff) drop-shadow(6px 6px 0 rgba(0,0,0,.45));
    animation: rainbow 2.4s linear infinite, wobble 1.1s ease-in-out infinite;
  }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @keyframes wobble { 0%,100% { transform: rotate(-1.6deg) } 50% { transform: rotate(1.6deg) } }

  .sub {
    text-align: center; font-size: 15px; font-weight: 700; margin-bottom: 10px;
    color: #11005c; text-shadow: 1px 1px 0 #fff;
  }
  .blink { animation: blink .55s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  /* ---------- 공통 패널 ---------- */
  .panel {
    width: 100%; max-width: 760px; margin-top: 12px; padding: 14px;
    background: #fffdf2; border: 5px ridge #ffcc00;
    box-shadow: 8px 8px 0 rgba(0,0,0,.5);
  }
  .panel h2 {
    font-size: 19px; margin-bottom: 10px; color: #c2007b;
    text-shadow: 1px 1px 0 #ffe600;
  }

  /* ---------- 카테고리 버튼 ---------- */
  #cats { display: flex; flex-wrap: wrap; gap: 7px; }
  .cat {
    font: inherit; font-size: 16px; cursor: pointer; padding: 8px 13px;
    background: linear-gradient(#fff, #ffe9a8);
    border: 3px outset #ff9d00; color: #7a2b00; font-weight: 700;
  }
  .cat:hover { background: linear-gradient(#fff6c2, #ffd65e); transform: scale(1.06) rotate(-2deg); }
  .cat:active { border-style: inset; }

  /* ---------- 입력 ---------- */
  #form { display: flex; gap: 7px; margin-bottom: 10px; }
  #name {
    flex: 1; font: inherit; font-size: 17px; padding: 9px;
    border: 3px inset #aaa; background: #fff;
  }
  #add {
    font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 9px 16px;
    background: linear-gradient(#b6ff6e, #2fbf00); border: 3px outset #1e8f00; color: #063400;
  }
  #add:active { border-style: inset; }

  #chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
  .chip {
    display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700;
    padding: 6px 9px; border: 3px solid #000; box-shadow: 3px 3px 0 rgba(0,0,0,.35);
  }
  .chip button {
    font: inherit; cursor: pointer; border: 2px solid #000; background: #fff;
    width: 22px; height: 22px; line-height: 1; padding: 0; font-weight: 700;
  }
  #empty { font-size: 14px; color: #8a7f6a; }

  /* ---------- 돌림판 ---------- */
  #stage { position: relative; margin-top: 16px; }
  canvas { display: block; filter: drop-shadow(6px 8px 0 rgba(0,0,0,.45)); }
  #pin {
    position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    font-size: 44px; line-height: 1; filter: drop-shadow(2px 2px 0 #000);
    pointer-events: none;
  }

  #spin {
    margin-top: 16px; font: inherit; cursor: pointer;
    font-size: clamp(24px, 6vw, 36px); font-weight: 700; letter-spacing: 4px;
    padding: 16px 40px; color: #fff;
    background: linear-gradient(#ff4d8d, #c2003f);
    border: 6px outset #ff9ec4;
    box-shadow: 7px 7px 0 rgba(0,0,0,.55);
    text-shadow: 2px 2px 0 #000;
    animation: pulse .7s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
  #spin:active { border-style: inset; transform: translate(3px,3px); }
  #spin:disabled { filter: grayscale(1); animation: none; cursor: wait; }

  #tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .mini {
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 8px 12px;
    background: #e8e8e8; border: 3px outset #bbb; color: #222;
  }
  .mini:active { border-style: inset; }

  /* ---------- 결과 팝업 ---------- */
  #modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); padding: 16px; z-index: 9;
  }
  #modal.on { display: flex; }
  #modal .box {
    background: #fffbe6; border: 8px ridge #ff00a8; padding: 26px 22px; text-align: center;
    max-width: 440px; width: 100%; box-shadow: 10px 10px 0 rgba(0,0,0,.6);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0 } }
  #modal .lead { font-size: 17px; font-weight: 700; color: #6b0030; }
  #win {
    margin: 12px 0; font-size: clamp(28px, 9vw, 46px); font-weight: 700; line-height: 1.25;
    color: #d10000; -webkit-text-stroke: 1px #000; text-shadow: 3px 3px 0 #ffe600;
    word-break: keep-all;
  }
  #quip { font-size: 16px; font-weight: 700; color: #004a9f; margin-bottom: 16px; }
  #modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #modal button {
    font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 11px 18px;
    border: 4px outset #888; background: linear-gradient(#fff, #ddd);
  }
  #modal button.go { background: linear-gradient(#ffe36e, #ffae00); border-color: #ff8a00; }
  #modal button:active { border-style: inset; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #000; color: #0f0; border: 3px ridge #0f0; padding: 10px 16px;
    font-size: 15px; font-weight: 700; display: none; z-index: 10;
  }
  #toast.on { display: block; }

  footer { margin-top: 18px; font-size: 13px; font-weight: 700; color: #2b0052; text-shadow: 1px 1px 0 #fff; text-align: center; }
</style>
</head>
<body>

<div id="ticker"><span>◀◀◀ 오늘 점심 뭐 먹을지 30분째 고민중이신가요? 고민은 배고픔만 늘릴 뿐! 운명의 돌림판이 정해드립니다 ★ 결과에 불복할 수 없습니다 ★ 돌림판은 거짓말을 하지 않습니다 ▶▶▶</span></div>

<h1>오늘 점심 뭐 먹지</h1>
<p class="sub"><span class="blink">★</span> 운 명 의 점 심 돌 림 판 <span class="blink">★</span></p>

<section class="panel">
  <h2>① 뭐 땡기는지 고르세요 (눌러서 한번에 채우기)</h2>
  <div id="cats"></div>
</section>

<section class="panel">
  <h2>② 아니면 직접 적으세요</h2>
  <form id="form" autocomplete="off">
    <input id="name" placeholder="예) 김밥천국, 이모네국밥 ..." maxlength="20">
    <button id="add" type="submit">추가</button>
  </form>
  <div id="chips"></div>
</section>

<div id="stage">
  <canvas id="cv" width="420" height="420"></canvas>
  <div id="pin">▼</div>
</div>

<button id="spin" type="button">돌 려 !!</button>

<div id="tools">
  <button class="mini" id="share" type="button">🔗 이 목록 링크 복사</button>
  <button class="mini" id="clear" type="button">🗑 전부 지우기</button>
  <button class="mini" id="sound" type="button">🔊 소리 켬</button>
</div>

<footer>※ 본 돌림판의 결정은 번복할 수 없으며<br>이의제기는 받지 않습니다 ※</footer>

<div id="modal">
  <div class="box">
    <div class="lead">두구두구두구… 오늘의 점심은!!</div>
    <div id="win">—</div>
    <div id="quip">—</div>
    <div class="row">
      <button class="go" id="again" type="button">한번 더 돌려</button>
      <button id="close" type="button">받아들인다</button>
    </div>
  </div>
</div>

<div id="toast">복사됨!</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
