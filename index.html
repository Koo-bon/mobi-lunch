<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 점심 뭐 먹지</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --line: #e4e1da;
    --text: #2c2a27;
    --muted: #8b857c;
    --accent: #d9644a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 16px 56px;
  }
  .wrap { width: 100%; max-width: 480px; }

  header { text-align: center; margin-bottom: 26px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  header p { margin-top: 7px; font-size: 14px; color: var(--muted); }

  section { margin-bottom: 18px; }
  section h2 {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: .4px; margin-bottom: 9px;
  }

  /* ---------- 카테고리 ---------- */
  #cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
  }
  .cat:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- 입력 ---------- */
  #form { display: flex; gap: 6px; margin-bottom: 10px; }
  #name {
    flex: 1; font: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text);
  }
  #name:focus { outline: none; border-color: var(--accent); }
  #add {
    font: inherit; font-size: 14px; cursor: pointer; padding: 10px 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text);
  }
  #add:hover { border-color: var(--accent); color: var(--accent); }

  #chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 6px 8px 6px 10px; border-radius: 7px;
    border: 1px solid rgba(0,0,0,.08);
  }
  .chip button {
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    border: none; background: none; color: rgba(0,0,0,.4); padding: 0;
  }
  .chip button:hover { color: rgba(0,0,0,.75); }
  #empty { font-size: 13px; color: var(--muted); }

  /* ---------- 돌림판 ---------- */
  #stage { position: relative; display: flex; justify-content: center; margin: 26px 0 20px; }
  canvas { display: block; }
  #pin {
    position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 15px solid var(--text);
  }

  #spin {
    display: block; width: 100%;
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    padding: 15px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
  }
  #spin:hover { filter: brightness(1.05); }
  #spin:disabled { background: #d8d4cd; color: #fff; cursor: not-allowed; }

  #tools { display: flex; gap: 14px; justify-content: center; margin-top: 14px; }
  .mini {
    font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: none; color: var(--muted); padding: 4px;
  }
  .mini:hover { color: var(--text); }

  footer { margin-top: 26px; text-align: center; font-size: 12px; color: #b5afa5; }

  /* ---------- 결과 ---------- */
  #modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(30,28,25,.45); padding: 20px; z-index: 9;
  }
  #modal.on { display: flex; }
  #modal .box {
    background: var(--card); border-radius: 14px; padding: 30px 24px 22px;
    text-align: center; max-width: 340px; width: 100%;
  }
  #modal .lead { font-size: 13px; color: var(--muted); }
  #win { margin: 10px 0 8px; font-size: 30px; font-weight: 700; word-break: keep-all; }
  #quip { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  #modal .row { display: flex; gap: 8px; }
  #modal button {
    flex: 1; font: inherit; font-size: 14px; cursor: pointer;
    padding: 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  #modal button.go { background: var(--accent); border-color: var(--accent); color: #fff; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--text); color: #fff; border-radius: 8px;
    padding: 10px 16px; font-size: 13px; display: none; z-index: 10;
  }
  #toast.on { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>오늘 점심 뭐 먹지</h1>
    <p>고민하지 말고 돌림판에 맡기세요</p>
  </header>

  <section>
    <h2>종류로 한번에 채우기</h2>
    <div id="cats"></div>
  </section>

  <section>
    <h2>직접 넣기</h2>
    <form id="form" autocomplete="off">
      <input id="name" placeholder="가게 이름이나 메뉴" maxlength="20">
      <button id="add" type="submit">추가</button>
    </form>
    <div id="chips"></div>
  </section>

  <div id="stage">
    <canvas id="cv" width="360" height="360"></canvas>
    <div id="pin"></div>
  </div>

  <button id="spin" type="button">돌리기</button>

  <div id="tools">
    <button class="mini" id="share" type="button">링크 복사</button>
    <button class="mini" id="clear" type="button">비우기</button>
    <button class="mini" id="sound" type="button">소리 끄기</button>
  </div>

  <footer>결과에 대한 이의는 접수되지 않습니다</footer>
</div>

<div id="modal">
  <div class="box">
    <div class="lead">오늘의 점심</div>
    <div id="win">—</div>
    <div id="quip">—</div>
    <div class="row">
      <button id="again" type="button">다시 돌리기</button>
      <button class="go" id="close" type="button">확인</button>
    </div>
  </div>
</div>

<div id="toast">복사됨</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
